name: astrbot_plugin_atri_command_help
display_name: ATRI指令大全
short_desc: ATRI 主题的指令大全：汇总所有插件指令并渲染成一张图
desc: >-
  本项目基于 AcceleratorYue 的 astrbot_plugin_command_help 修改而来。
  发送「/指令大全」（别名 /帮助、/指令帮助、/指令列表）后，自动抓取所有已加载插件的指令
  （含指令组、子指令、别名、必填/可选参数、权限角标），使用 ATRI 底图与半透明卡片，在本机用
  Pillow 渲染成一张图片。普通用户自动隐藏仅管理员 / 群管可用的指令，
  管理员还可通过「隐藏规则」按插件或指令裁剪展示内容；不依赖远端 T2I 渲染服务，离线也能出图。
version: 1.2.0
author: 星见千夜
repo: https://github.com/HoshimiSenya/astrbot_plugin_atri_command_help
social_link: https://github.com/HoshimiSenya
